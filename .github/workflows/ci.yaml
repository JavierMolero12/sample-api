name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio para el GITHUB_TOKEN: cada job amplía solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En PRs se cancelan ejecuciones obsoletas; en main nunca, para no dejar a medias
  # una actualización del repositorio GitOps.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: sample-api
  # Versión fijada de Trivy: un escáner sin fijar puede cambiar el resultado del pipeline
  # entre dos ejecuciones idénticas.
  TRIVY_VERSION: "0.76.0"

jobs:
  lint-test:
    name: 1. Lint y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest

  build-scan-push:
    name: 2-3. Build, escaneo Trivy y push a GHCR
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular nombre de la imagen
        id: meta
        # GHCR exige el propietario en minúsculas.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build (carga local para escanear)
        uses: docker/build-push-action@v7
        with:
          context: .
          # Se carga en el daemon local en vez de publicar: la imagen solo sale a GHCR
          # si pasa el escaneo, y la que se publica es exactamente la escaneada.
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades con Trivy
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        # Falla el pipeline ante CVEs HIGH/CRITICAL que ya tienen parche disponible.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${IMAGE_REF}"

      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de la imagen escaneada
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        # Tag inmutable = SHA del commit: cada despliegue es trazable a su código fuente.
        run: docker push "${IMAGE_REF}"

  update-gitops-dev:
    name: 4. Actualizar tag en gitops-manifests (dev)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serializa las escrituras en el repo GitOps para evitar commits en carrera.
    concurrency:
      group: gitops-manifests-dev
      cancel-in-progress: false
    steps:
      - name: Checkout de gitops-manifests
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/gitops-manifests
          # PAT fine-grained con "Contents: Read and write" SOLO sobre gitops-manifests.
          # El GITHUB_TOKEN de este repo no puede escribir en otro repositorio.
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops-manifests

      - name: Actualizar imagen del overlay dev
        working-directory: gitops-manifests
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          TAG: ${{ github.sha }}
        # yq viene preinstalado en ubuntu-latest. Solo se toca el overlay de dev:
        # prod se promociona mediante Pull Request revisada.
        run: |
          yq -i '
            (.images[] | select(.name == "sample-api")) |= (
              .newName = strenv(IMAGE) |
              .newTag = strenv(TAG) |
              .newTag style="double"
            )
          ' apps/overlays/dev/kustomization.yaml
          git --no-pager diff

      - name: Commit y push
        working-directory: gitops-manifests
        env:
          TAG: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "El overlay dev ya apunta a ${TAG}; nada que hacer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(dev): deploy sample-api ${TAG::7}" -m "Origen: ${SOURCE_REPO}@${TAG}"
          # Reintentos con rebase por si otro pipeline escribió en el repo entretanto.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); reintentando..."
            sleep $((attempt * 5))
          done
          echo "No se pudo publicar el cambio en gitops-manifests" >&2
          exit 1
